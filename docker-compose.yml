services:
  opensearch-node1:
    image: opensearchproject/opensearch:latest
    container_name: opensearch-node1
    environment:
      - cluster.name=opensearch-cluster
      - node.name=opensearch-node1
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - "OPENSEARCH_JAVA_OPTS=-Xms2g -Xmx2g"  
      - plugins.security.disabled=false
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=ComplexPassword123!
    healthcheck:
      test: ["CMD-SHELL", "curl -k -u admin:ComplexPassword123! https://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - 9200:9200
      - 9600:9600
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    networks:
      - litellm-network

  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:latest
    container_name: opensearch-dashboards
    ports:
      - 5601:5601
    expose:
      - "5601"
    environment:
      - 'OPENSEARCH_HOSTS=["https://opensearch-node1:9200"]'
      - OPENSEARCH_USERNAME=admin
      - OPENSEARCH_PASSWORD=ComplexPassword123!
      - OPENSEARCH_SSL_VERIFICATIONMODE=none
    networks:
      - litellm-network
    depends_on:
      opensearch-node1:
        condition: service_healthy

  mcp-server:
    build: ./mcp
    container_name: mcp-server
    environment:
      - OPENSEARCH_HOST=opensearch-node1
      - OPENSEARCH_PORT=9200
      - OPENSEARCH_USER=admin
      - OPENSEARCH_PASSWORD=ComplexPassword123!
      - MARKDOWN_DIR=/markdown_data
      - STATIC_SERVER_EXTERNAL_URL=${STATIC_SERVER_EXTERNAL_URL}
    networks:
      - litellm-network

    volumes:
      - ./markdown:/markdown_data
    ports:
      - 8002:8002
    depends_on:
      opensearch-node1:
        condition: service_healthy

  static-server:
    build:
      context: ./mcp
      dockerfile: Dockerfile
    container_name: static-server
    ports:
      - "8003:8003"
    volumes:
      - ./prepare_data/data/extracted:/app/prepare_data/data/extracted:ro
    environment:
      - XML_DATA_DIR=/app/prepare_data/data/extracted  
    command: python src/static_server.py
    networks:
      - litellm-network

  data-preparer:
    build:
      context: ./prepare_data
      dockerfile: Dockerfile
    container_name: data-preparer
    restart: always
    environment:
      - RUN_ON_STARTUP=false
      - MAX_WORKERS=2
    volumes:
      - ./mcp/markdown:/app/mcp/markdown
      - ./prepare_data/data:/app/prepare_data/data
    depends_on:
      opensearch-node1:
        condition: service_healthy
    networks:
      - litellm-network

  litellm-db:
    image: postgres:15
    container_name: litellm-db
    networks:
      - litellm-network
    environment:
      POSTGRES_DB: litellm
      POSTGRES_USER: llmproxy
      POSTGRES_PASSWORD: dbpassword9090
    volumes:
      - litellm-db-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U llmproxy -d litellm"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 15s

  litellm-proxy:
    image: ghcr.io/berriai/litellm:main-latest
    container_name: litellm-proxy
    restart: on-failure:5
    networks:
      - litellm-network
    ports:
      - "4000:4000"
    volumes:
      - ./own/LiteLLM/config.yaml:/app/config.yaml
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - DATABASE_URL=postgresql://llmproxy:dbpassword9090@litellm-db:5432/litellm
    command: ["--config", "/app/config.yaml", "--port", "4000", "--detailed_debug"]
    depends_on:
      litellm-db:
        condition: service_healthy

networks:
  litellm-network:
    driver: bridge

volumes:
  opensearch-data:
  litellm-db-data: