services:
  opensearch-node1:
    image: opensearchproject/opensearch:latest
    container_name: opensearch-node1
    environment:
      - cluster.name=opensearch-cluster
      - node.name=opensearch-node1
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - "OPENSEARCH_JAVA_OPTS=-Xms2g -Xmx2g"
      - plugins.security.disabled=false
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=ComplexPassword123!
    healthcheck:
      test: ["CMD-SHELL", "curl -k -u admin:ComplexPassword123! https://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - 9200:9200
      - 9600:9600
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    networks:
      - app-network

  # mcp-server-bw:
  #   build: ./mcp
  #   container_name: mcp-server-bw
  #   environment:
  #     - INDEX_NAME=court-decisions-bw
  #     - OPENSEARCH_HOST=opensearch-node1
  #     - OPENSEARCH_PORT=9200
  #     - OPENSEARCH_USER=admin
  #     - OPENSEARCH_PASSWORD=ComplexPassword123!
  #     - STATIC_SERVER_EXTERNAL_URL=${STATIC_SERVER_EXTERNAL_URL}
  #   networks:
  #     - app-network
  #   ports:
  #     - 8004:8002
  #   depends_on:
  #     opensearch-node1:
  #       condition: service_healthy

  mcp-server-bgh:
    build: ./mcp
    container_name: mcp-server-bgh
    environment:
      - INDEX_NAME=court-decisions
      - OPENSEARCH_HOST=opensearch-node1
      - OPENSEARCH_PORT=9200
      - OPENSEARCH_USER=admin
      - OPENSEARCH_PASSWORD=ComplexPassword123!
      - STATIC_SERVER_EXTERNAL_URL=${STATIC_SERVER_EXTERNAL_URL}
    networks:
      - app-network
    ports:
      - 8002:8002
    depends_on:
      opensearch-node1:
        condition: service_healthy

  mcp-server-states:
    build: ./mcp
    container_name: mcp-server-states
    environment:
      # Sucht im neuen, gemeinsamen Index
      - INDEX_NAME=court-decisions-states
      - OPENSEARCH_HOST=opensearch-node1
      - OPENSEARCH_PORT=9200
      - OPENSEARCH_USER=admin
      - OPENSEARCH_PASSWORD=ComplexPassword123!
      - STATIC_SERVER_EXTERNAL_URL=${STATIC_SERVER_EXTERNAL_URL}
    networks:
      - app-network
    ports:
      - 8004:8002  # Der Port, unter dem dein LLM diesen Server anspricht
    depends_on:
      opensearch-node1:
        condition: service_healthy

  static-server:
    build:
      context: ./mcp
      dockerfile: Dockerfile
    container_name: static-server
    ports:
      - "8003:8003"
    volumes:
      # Wir mounten einfach den gesamten data-Ordner (BGH, BW, BY, etc. sind alle hier drin)
      - ./mcp/data:/app/mcp/data:ro
    environment:
      # Wir geben dem Server nur noch das Basis-Verzeichnis mit
      - BASE_DATA_DIR=/app/mcp/data 
    command: python src/static_server.py
    networks:
      - app-network

  data-preparer:
    build:
      context: ./prepare_data
      dockerfile: Dockerfile
    container_name: data-preparer
    restart: always
    environment:
      - RUN_ON_STARTUP=false
      - MAX_WORKERS=2
    volumes:
      - ./mcp/data:/app/mcp/data:ro
      - ./prepare_data/data:/app/prepare_data/data
    depends_on:
      opensearch-node1:
        condition: service_healthy
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  opensearch-data: